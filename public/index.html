<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f14" />
    <title>TelePlugin</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body>
    <div class="app">
      <div class="stage">
        <div class="remote-video-host" id="remoteVideoHost">
          <canvas
            id="remoteVideoCanvas"
            class="remote-video-canvas"
            aria-hidden="true"
          ></canvas>
          <video
            id="remoteVideo"
            class="remote-video-source"
            autoplay
            playsinline
            muted
          ></video>
        </div>

        <div class="vignette" aria-hidden="true"></div>

        <div
          class="head-look-layer"
          id="headLookLayer"
          hidden
          data-host="head-look"
          data-i18n-aria="head.layer"
          aria-label="Arraste para mover a cabeça do robô"
        >
          <p class="head-drag-hint" data-i18n="head.look">Arraste para olhar</p>
        </div>

        <div class="remote-overlay" id="remotePlaceholder">
          <div class="waiting-mark" aria-hidden="true"></div>
          <p data-i18n="status.waitingRobot">Aguardando o robô…</p>
        </div>

        <header class="hud-top">
          <div class="brand">
            <img
              class="brand-logo"
              src="assets/logo-pluginbot.png"
              alt="Pluginbot"
              data-i18n-alt="brand.alt"
            />
            <span class="room-label" id="roomLabel"></span>
          </div>
          <div class="hud-top-right">
            <div id="sessionCountdown" class="session-countdown" hidden></div>
            <div id="powerHost" class="power-host" data-host="power" hidden></div>
            <div
              class="status-chip"
              id="statusChip"
              role="status"
              aria-live="polite"
              data-i18n="status.disconnected"
            >
              Desconectado
            </div>
            <div class="lang-switch" id="langSwitch">
              <button
                type="button"
                id="langToggle"
                class="lang-current"
                aria-haspopup="listbox"
                aria-expanded="false"
                data-i18n-aria="lang.group"
                aria-label="Idioma"
              >
                <img
                  id="langCurrentFlag"
                  src="assets/flags/br.png"
                  alt=""
                  width="22"
                  height="16"
                />
              </button>
              <ul
                class="lang-menu hidden"
                id="langMenu"
                role="listbox"
                data-i18n-aria="lang.group"
              >
                <li role="none">
                  <button
                    type="button"
                    role="option"
                    data-locale="pt-BR"
                    data-i18n-aria="lang.pt-BR"
                    data-i18n-title="lang.pt-BR"
                    title="Português"
                  >
                    <img src="assets/flags/br.png" alt="" width="22" height="16" />
                    <span data-i18n="lang.pt-BR">Português</span>
                  </button>
                </li>
                <li role="none">
                  <button
                    type="button"
                    role="option"
                    data-locale="en"
                    data-i18n-aria="lang.en"
                    data-i18n-title="lang.en"
                    title="English"
                  >
                    <img src="assets/flags/us.png" alt="" width="22" height="16" />
                    <span data-i18n="lang.en">English</span>
                  </button>
                </li>
                <li role="none">
                  <button
                    type="button"
                    role="option"
                    data-locale="es"
                    data-i18n-aria="lang.es"
                    data-i18n-title="lang.es"
                    title="Español"
                  >
                    <img src="assets/flags/es.png" alt="" width="22" height="16" />
                    <span data-i18n="lang.es">Español</span>
                  </button>
                </li>
                <li role="none">
                  <button
                    type="button"
                    role="option"
                    data-locale="fr"
                    data-i18n-aria="lang.fr"
                    data-i18n-title="lang.fr"
                    title="Français"
                  >
                    <img src="assets/flags/fr.png" alt="" width="22" height="16" />
                    <span data-i18n="lang.fr">Français</span>
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </header>

        <div class="move-hud" id="locomotionHost" data-host="locomotion">
          <div class="joystick-wrap">
            <div
              id="joystick"
              class="joystick is-disabled"
              role="application"
              data-i18n-aria="movement.joystick"
              aria-label="Controle de movimento do robô"
            >
              <span class="joy-chevron n" aria-hidden="true"></span>
              <span class="joy-chevron e" aria-hidden="true"></span>
              <span class="joy-chevron s" aria-hidden="true"></span>
              <span class="joy-chevron w" aria-hidden="true"></span>
              <div class="joystick-stick"></div>
            </div>
            <p class="joystick-hint" id="movementHint"></p>
          </div>

          <div
            class="kbd-hint"
            id="kbdHint"
            data-i18n-aria="movement.hintKeyboard"
            aria-label="WASD ou setas para mover. Espaço para parar."
          >
            <span class="kbd-key" data-key="w">W</span>
            <span class="kbd-key" data-key="a">A</span>
            <span class="kbd-key" data-key="s">S</span>
            <span class="kbd-key" data-key="d">D</span>
          </div>
        </div>

        <div class="local-pip hidden" id="localPip">
          <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <footer class="call-bar" id="callBar">
          <button
            id="btnToggleMic"
            class="ctrl"
            type="button"
            disabled
            data-i18n-aria="media.micOff"
            aria-label="Ligar microfone"
          >
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
              <path
                d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v3"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
            <span class="slash" aria-hidden="true"></span>
          </button>

          <button
            id="btnToggleCam"
            class="ctrl"
            type="button"
            disabled
            data-i18n-aria="media.camOff"
            aria-label="Ligar câmera"
          >
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect
                x="3"
                y="7"
                width="12.5"
                height="10"
                rx="2.2"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path
                d="M15.5 11.2 21 8.4v7.2l-5.5-2.8v-2.6Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
            </svg>
            <span class="slash" aria-hidden="true"></span>
          </button>

          <div class="popover-host">
            <button
              id="btnVideoQuality"
              class="ctrl quality-btn"
              type="button"
              disabled
              data-i18n-aria="video.openPanel"
              aria-label="Qualidade de vídeo"
              aria-haspopup="dialog"
              aria-expanded="false"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect
                  x="3"
                  y="5"
                  width="18"
                  height="14"
                  rx="2.2"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
                <path
                  d="M8 15h8M10 11h4"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
              <span class="quality-badge" id="qualityBadge" aria-hidden="true">H</span>
            </button>

            <div
              id="qualityPanel"
              class="hud-popover quality-panel hidden"
              role="dialog"
              data-i18n-aria="video.panelTitle"
              aria-label="Qualidade do vídeo"
            >
              <div class="hud-popover-head">
                <h2 class="hud-popover-title quality-title">
                  <span data-i18n="video.panelTitle">Qualidade</span>
                  <span class="quality-sep" aria-hidden="true">·</span>
                  <span id="qualityValueLabel">Alta</span>
                </h2>
                <button
                  type="button"
                  id="btnCloseQuality"
                  class="hud-popover-close"
                  data-i18n-aria="dialog.close"
                  aria-label="Fechar"
                >
                  ×
                </button>
              </div>

              <div class="hud-popover-body">
                <div
                  id="qualitySlider"
                  class="quality-slider"
                  tabindex="0"
                  role="slider"
                  aria-valuemin="0"
                  aria-valuemax="4"
                  aria-valuenow="3"
                  data-i18n-aria="video.panelTitle"
                  aria-label="Qualidade do vídeo"
                >
                  <div class="quality-track" aria-hidden="true">
                    <div class="quality-track-fill" id="qualityTrackFill"></div>
                  </div>
                  <div class="quality-thumb" id="qualityThumb" aria-hidden="true"></div>
                </div>

                <div class="quality-ticks" id="qualityTicks" role="listbox"></div>
              </div>
            </div>
          </div>

          <div
            id="volumeHost"
            class="popover-host volume-host"
            data-host="volume"
            hidden
          ></div>

          <button
            id="btnSendCommand"
            class="ctrl"
            type="button"
            disabled
            data-control="beep"
            data-i18n-aria="media.ringStart"
            aria-label="Tocar chamada no robô"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M5.5 9.5a12.5 12.5 0 0 0 5 5l1.8-1.8a1 1 0 0 1 .9-.25c1 .3 2 .45 3.1.45a1 1 0 0 1 1 1V17a1 1 0 0 1-1 1A14.5 14.5 0 0 1 2 4.5a1 1 0 0 1 1-1h3.2a1 1 0 0 1 1 1c0 1.1.15 2.1.45 3.1a1 1 0 0 1-.25.9L5.5 9.5z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M15 4a5 5 0 0 1 5 5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                d="M17.5 1.5a8 8 0 0 1 4.5 4.5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>

          <div id="featureHost" class="feature-host" data-host="call"></div>

          <button
            id="btnHangup"
            class="ctrl hangup"
            type="button"
            disabled
            data-i18n-aria="call.hangup"
            aria-label="Encerrar"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"
              />
            </svg>
          </button>
        </footer>

        <div
          id="hudTooltip"
          class="hud-tooltip"
          role="tooltip"
          aria-hidden="true"
        ></div>

        <div id="endedOverlay" class="ended-overlay hidden">
          <p data-i18n="call.ended">Chamada encerrada</p>
          <button id="btnRejoin" class="rejoin" type="button" data-i18n="call.rejoin">
            Entrar novamente
          </button>
        </div>

        <div id="inviteOverlay" class="ended-overlay hidden">
          <img id="inviteLogo" class="invite-logo hidden" alt="" />
          <p id="inviteOverlayText" data-i18n="invite.expired">Convite expirado</p>
          <p id="inviteWindow" class="invite-window hidden"></p>
          <form id="identifyForm" class="identify-form hidden">
            <p id="identifyDescription" class="identify-description hidden"></p>
            <input
              id="identifyInput"
              class="identify-input"
              type="text"
              autocomplete="off"
              data-i18n-aria="invite.identifyTitle"
            />
            <p
              id="identifyError"
              class="identify-error hidden"
              data-i18n="invite.identifyError"
            >
              Identificação inválida
            </p>
            <button
              type="submit"
              class="rejoin hidden"
              data-i18n="invite.identifySubmit"
            >
              Continuar
            </button>
          </form>
          <button
            id="inviteEnter"
            class="rejoin hidden"
            type="button"
            data-i18n="invite.enter"
          >
            Entrar
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
